<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NARUTO AI PRO - UNHACKABLE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { overflow: hidden; height: 100vh; width: 100vw; background: #000; font-family: 'Rajdhani', sans-serif; }

        iframe#bg-site {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; z-index: 1;
        }

        /* મেইন ফ্লোটিং প্যানেল (বর্ডার এখন ব্লু নিয়ন) */
        #hack-overlay {
            position: absolute;
            top: 15%; right: 5%;
            width: 150px;
            z-index: 9999;
            background: #0d0d0d; 
            border-radius: 16px;
            padding: 15px 12px 12px 12px;
            text-align: center;
            /* ব্লু অ্যানিমেটেড নিয়ন বর্ডার */
            border: 2px solid #00f2ff;
            animation: blueNeonPulse 1.5s infinite alternate;
        }

        /* 🔵 ব্লু নিয়ন অ্যানিমেশন */
        @keyframes blueNeonPulse {
            0% { box-shadow: 0 0 5px #00f2ff, inset 0 0 5px #00f2ff; border-color: #00a2ff; }
            100% { box-shadow: 0 0 20px #00f2ff, inset 0 0 10px #00f2ff; border-color: #00f2ff; }
        }

        .drag-header {
            width: 100%; height: 30px;
            position: absolute; top: 0; left: 0;
            cursor: move; z-index: 5;
        }

        /* লোগো এবং টাইটেল */
        .avatar-box {
            width: 45px; height: 45px;
            margin: 0 auto 8px;
            border-radius: 50%;
            border: 2px solid #ff0055;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.6);
            overflow: hidden;
            background: #111;
            display: flex; align-items: center; justify-content: center;
        }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .title-main { 
            color: #f7b924; font-size: 10px; font-weight: 800; 
            margin-bottom: 12px; letter-spacing: 1px; font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 5px rgba(247, 185, 36, 0.5);
        }

        /* ইনপুট এবং বাটন (লগিন পেজ) */
        .cipher-input {
            width: 100%; padding: 8px; background: #151515; border: 1px solid #333;
            color: #fff; text-align: center; font-size: 10px; margin-bottom: 8px;
            outline: none; border-radius: 6px; font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px; transition: 0.3s;
        }
        .cipher-input:focus { border-color: #00f2ff; box-shadow: 0 0 8px rgba(0, 242, 255, 0.4); }
        .cipher-input::placeholder { color: #555; }

        .btn-start {
            width: 100%; padding: 8px; border: none; border-radius: 6px;
            font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 11px; 
            cursor: pointer; color: white; text-transform: uppercase;
            background: #ff0044;
            box-shadow: 0 0 12px rgba(255, 0, 68, 0.6);
            transition: 0.2s;
        }
        .btn-start:active { transform: scale(0.95); }
        .error { color: #ff0044; font-size: 8px; margin-bottom: 6px; display: none; font-weight: bold; }

        /* মেইন রেজাল্ট পেজের ডিজাইন */
        .big-result {
            font-size: 28px; font-weight: 900; color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            margin: 5px 0 5px 0; letter-spacing: 2px; line-height: 1;
            text-shadow: 0 0 10px rgba(255,255,255,0.4);
        }

        /* 🌈 RGB গ্লোয়িং অ্যানিমেশন */
        @keyframes rgbTextGlow {
            0% { color: #ff0000; text-shadow: 0 0 15px #ff0000, 0 0 30px #ff0000; }
            16% { color: #ff00ff; text-shadow: 0 0 15px #ff00ff, 0 0 30px #ff00ff; }
            33% { color: #0000ff; text-shadow: 0 0 15px #0000ff, 0 0 30px #0000ff; }
            50% { color: #00ffff; text-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff; }
            66% { color: #00ff00; text-shadow: 0 0 15px #00ff00, 0 0 30px #00ff00; }
            83% { color: #ffff00; text-shadow: 0 0 15px #ffff00, 0 0 30px #ffff00; }
            100% { color: #ff0000; text-shadow: 0 0 15px #ff0000, 0 0 30px #ff0000; }
        }

        .rgb-text {
            animation: rgbTextGlow 1.5s linear infinite;
        }

        .period-target {
            color: #777; font-size: 8px; font-weight: bold; margin-bottom: 8px;
            letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 5px;
        }

        .sync-timer { 
            color: #f7b924; font-size: 10px; font-weight: 900; 
            font-family: 'Orbitron', sans-serif; letter-spacing: 1px;
            border-top: 1px solid #222; padding-top: 8px; margin-top: 5px;
        }

        .green-dot { height: 6px; width: 6px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 8px #00ff88; display: inline-block; transition: 0.3s; }
        .red-dot { height: 6px; width: 6px; background: #ff0033; border-radius: 50%; box-shadow: 0 0 8px #ff0033; display: inline-block; transition: 0.3s; }

        @keyframes loadPulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .loading-anim { animation: loadPulse 0.8s ease-in-out infinite; color: #555; text-shadow: none; }
    </style>
</head>
<body>

    <div id="hack-overlay">

        <div class="title-main">NARUTO MINI HACK</div>

    </div>

    <script>
        // ==========================================
        // 🔒 ANTI-HACK & SECURITY SYSTEM
        // ==========================================
        document.addEventListener('contextmenu', event => event.preventDefault());
        
        document.addEventListener('keydown', function(e) {
            if(e.keyCode === 123 || (e.ctrlKey && e.shiftKey && e.keyCode === 73) || (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault();

        // ==========================================
        // ⚙️ MAIN HACK LOGIC

        var VALID_PASSWORD = "naruto099"; 
        
        var API_URL = 'https://api.inpay88.net/api/webapi/GetNoaverageEmerdList';
        var currentPeriod = null;
        var prevCycleIndex = -1;
        var BD_MS = 6 * 60 * 60 * 1000;

        function getBDSeconds() { return Math.floor((Date.now() + BD_MS) / 1000); }
        function getCountdown() { var mod = getBDSeconds() % 60 % 30; return mod === 0 ? 30 : 30 - mod; }
        function getBDCycleIndex() { return Math.floor(getBDSeconds() / 30); }

        function addOne(str) {
            var m = str.match(/(\d+)$/);
            if (!m) return str;
            var numStr = m[1];
            var prefix = str.substring(0, str.length - numStr.length);
            var num = BigInt(numStr) + 1n;
            var s = num.toString();
            while (s.length < numStr.length) s = '0' + s;
            return prefix + s;
        }

        function checkLogin() {
            var input = document.getElementById('passwordInput').value.trim();
            if (input === VALID_PASSWORD) {
                document.getElementById('dynamic-container').innerHTML = `
                    <div id="prediction-text" class="big-result loading-anim">WAIT</div>
                    <div class="period-target">
                        P: <span id="period-display">Loading...</span>
                        <span id="status-dot" class="red-dot"></span>
                    </div>
                    <div class="sync-timer">SYNC: 00:<span id="countdown">30</span></div>
                `;
                startSystem();
            } else {
                var err = document.getElementById('errorMsg');
                err.style.display = 'block';
                setTimeout(function() { err.style.display = 'none'; }, 2000);
            }
        }

        function setConnectionStatus(isOnline) {
            var dot = document.getElementById('status-dot');
            if(dot) dot.className = isOnline ? 'green-dot' : 'red-dot';
        }

        function startSystem() {
            fetchPrediction();
            setInterval(function() {
                var rem = getCountdown();
                var cdEl = document.getElementById('countdown');
                if(cdEl) cdEl.innerText = rem < 10 ? '0' + rem : rem;

                var cycle = getBDCycleIndex();
                if (prevCycleIndex !== -1 && cycle !== prevCycleIndex) {
                    currentPeriod = addOne(currentPeriod);
                    fetchPrediction();
                }
                prevCycleIndex = cycle;

                var pdEl = document.getElementById('period-display');
                if (currentPeriod && pdEl) pdEl.innerText = currentPeriod;
            }, 1000);
        }

        function fetchPrediction() {

                el.className = 'big-result loading-anim';
                el.innerText = 'WAIT';
            }

            fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json;charset=UTF-8',
                    'Accept': 'application/json, text/plain, */*',
                    'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpYXQiOiIxNzc5MDE2NzkwIiwibmJmIjoiMTc3OTAxNjc5MCIsImV4cCI6IjE3NzkwMTg1OTAiLCJodHRwOi8vc2NoZW1hcy5taWNyb3NvZnQuY29tL3dzLzIwMDgvMDYvaWRlbnRpdHkvY2xhaW1zL2V4cGlyYXRpb24iOiI1LzE3LzIwMjYgNTo0OTo1MCBQTSIsImh0dHA6Ly9zY2hlbWFzLm1pY3Jvc29mdC5jb20vd3MvMjAwOC8wNi9pZGVudGl0eS9jbGFpbXMvcm9sZSI6IkFjY2Vzc19Ub2tlbiIsIlVzZXJJZCI6IjEzNTQzMyIsIlVzZXJOYW1lIjoiODgwMTUzODAxNjI5OSIsIlVzZXJQaG90byI6IjEiLCJOaWNrTmFtZSI6Ik1lbWJlck5ORzJUTTNYIiwiQW1vdW50IjoiMC45MSIsIkludGVncmFsIjoiMCIsIkxvZ2luTWFyayI6Ikg1IiwiTG9naW5UaW1lIjoiNS8xNy8yMDI2IDU6MTk6NTAgUE0iLCJMb2dpbklQQWRkcmVzcyI6IjIwMy43Ni4yMjEuMjQ4IiwiRGJOdW1iZXIiOiIwIiwiSXN2YWxpZGF0b3IiOiIwIiwiS2V5Q29kZSI6IjI3IiwiVG9rZW5UeXBlIjoiQWNjZXNzX1Rva2VuIiwiUGhvbmVUeXBlIjoiMSIsIlVzZXJUeXBlIjoiMCIsIlVzZXJOYW1lMiI6IiIsImlzcyI6Imp3dElzc3VlciIsImF1ZCI6ImxvdHRlcnlUaWNrZXQifQ.otR_EQYhBeBRS_qesDlzd22JVehFEUBmHA0MzIwsoWE'
                },
                body: JSON.stringify({
                    "pageSize": 10, "pageNo": 1, "typeId": 30, "language": 0,
                    "visitorId": "e695c94ab55e739930ab18782c612a48",
                    "random": "61bbaf505dd14e7aa81ba687c974178d",
                    "signature": "558BB707A61FA8D6BBB1748C5065F77A", "timestamp": 1779019083
                })
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var item = null;
                if (data && data.data && Array.isArray(data.data.list) && data.data.list.length > 0) {
                    item = data.data.list[0];
                }
                if (item) {
                    setConnectionStatus(true);
                    var apiPeriod = item.issueNumber || item.issue || item.period || '';
                    if (apiPeriod) currentPeriod = addOne(apiPeriod);

                    var lastNum = parseInt(item.number || 0);
                    if (isNaN(lastNum) || lastNum < 0) lastNum = 0;
                    var prediction = (lastNum % 2 === 0) ? "SMALL" : "BIG";
                    updatePrediction(prediction);
                } else {
                    setConnectionStatus(false);
                    fallbackPrediction(); 
                }
            })
            .catch(function() { 
                setConnectionStatus(false);
                fallbackPrediction(); 
            });
        }

        function fallbackPrediction() {
            if (currentPeriod) currentPeriod = addOne(currentPeriod);
            var prediction = Math.random() > 0.5 ? "BIG" : "SMALL";
            updatePrediction(prediction);
        }

        function updatePrediction(type) {
            var pdEl = document.getElementById('period-display');
            if (currentPeriod && pdEl) pdEl.innerText = currentPeriod;
            var el = document.getElementById('prediction-text');
            if(el) {
                el.innerText = type;
                el.classList.remove('loading-anim');
                el.classList.add('rgb-text');
            }
        }

        /* ড্র্যাগ সিস্টেম */
        var overlay = document.getElementById('hack-overlay');
        var header = document.getElementById('dragHeader');
        var isDragging = false, startX, startY, initialLeft, initialTop;

        header.addEventListener('mousedown', startDrag);
        header.addEventListener('touchstart', startDrag, { passive: false });
        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag, { passive: false });
        document.addEventListener('mouseup', stopDrag);
        document.addEventListener('touchend', stopDrag);

        function startDrag(e) {
            isDragging = true;
            var cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            var cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            startX = cx; startY = cy;
            initialLeft = overlay.offsetLeft; initialTop = overlay.offsetTop;
        }
        
        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();
            var cx = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            var cy = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            overlay.style.left = (initialLeft + (cx - startX)) + 'px';
            overlay.style.top = (initialTop + (cy - startY)) + 'px';
            overlay.style.right = 'auto';
        }
        
        function stopDrag() { isDragging = false; }
    </script>
</body>
